<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEIRIN TRACKER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="競輪メモ">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .text-neon { color: #66fcf1; }
        .bg-neon { background-color: #66fcf1; }
        .text-accent { color: #c5e1a5; }
        .bg-accent { background-color: #c5e1a5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .chip-active { background-color: #c5e1a5 !important; color: #000 !important; font-weight: bold; }
    </style>
</head>
<body class="pb-24 select-none">

    <header class="p-4 pt-8 border-b border-gray-800 bg-[#1f2833]/30 backdrop-blur sticky top-0 z-40 flex justify-between items-center">
        <div>
            <p class="text-xs tracking-widest text-gray-500 font-bold uppercase">Keirin Tracker</p>
            <h1 id="page-title" class="text-2xl font-black text-white tracking-tight">ダッシュボード</h1>
        </div>
        <button onclick="openModal()" class="bg-accent text-black font-bold px-4 py-2 rounded-full text-sm flex items-center gap-1 shadow-lg shadow-accent/20 active:scale-95 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>予想追加
        </button>
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <div id="tab-home" class="tab-content active space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">的中率</p>
                    <p id="stat-hit-rate" class="text-2xl font-black text-accent mt-1">0%</p>
                    <p id="stat-count" class="text-xs text-gray-500 mt-1">0/0 レース</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">回収率</p>
                    <p id="stat-return-rate" class="text-2xl font-black text-rose-400 mt-1">0%</p>
                    <p id="stat-io" class="text-xs text-gray-500 mt-1">投資対回収</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">累計損益</p>
                    <p id="stat-profit" class="text-2xl font-black text-accent mt-1">+0円</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">総投資額</p>
                    <p id="stat-total-invest" class="text-2xl font-black text-gray-300 mt-1">0円</p>
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="text-sm font-bold text-gray-400 px-1">最近の予想</h3>
                <div id="recent-predictions-list" class="space-y-2"></div>
            </div>
        </div>

        <div id="tab-records" class="tab-content space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-bold text-gray-400">すべての履歴</h3>
                <button onclick="clearAllData()" class="text-xs text-rose-400 flex items-center gap-1 bg-rose-950/20 px-2 py-1 rounded border border-rose-900/30">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>全消去
                </button>
            </div>
            <div id="all-records-list" class="space-y-2"></div>
        </div>

        <div id="tab-analysis" class="tab-content space-y-4">
            <div class="bg-[#1f2833]/30 p-4 rounded-2xl border border-gray-800">
                <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-accent"></i>競輪場別 相性トップ3
                </h3>
                <div id="track-ranking" class="space-y-2 text-sm text-gray-400"></div>
            </div>
            <div class="bg-[#1f2833]/30 p-4 rounded-2xl border border-gray-800">
                <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                    <i data-lucide="award" class="w-4 h-4 text-accent"></i>グレード別 回収率
                </h3>
                <div id="grade-ranking" class="space-y-2 text-sm text-gray-400"></div>
            </div>
        </div>

    </main>

    <div id="prediction-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#151a22] w-full max-w-md rounded-t-3xl sm:rounded-3xl border-t sm:border border-gray-800 max-h-[92vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h2 class="text-base font-black text-white">レース予想の記録</h2>
                <button onclick="closeModal()" class="text-gray-400 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="prediction-form" onsubmit="savePrediction(event)" class="space-y-4 text-xs">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-400 font-bold mb-1">日付</label>
                        <input type="date" id="form-date" required class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2 text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-bold mb-1">競輪場</label>
                        <input type="text" id="form-track" list="track-suggestions" placeholder="松阪" required class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2 text-white focus:outline-none focus:border-accent">
                        <datalist id="track-suggestions">
                            <option value="函館"><option value="青森"><option value="いわき平"><option value="弥彦"><option value="前橋"><option value="取手"><option value="宇都宮"><option value="大宮"><option value="西武園"><option value="京王閣"><option value="立川"><option value="松戸"><option value="千葉JP"><option value="川崎"><option value="平塚"><option value="小田原"><option value="伊東"><option value="静岡"><option value="名古屋"><option value="岐阜"><option value="大垣"><option value="豊橋"><option value="富山"><option value="松阪"><option value="四日市"><option value="福井"><option value="京都向日町"><option value="奈良"><option value="和歌山"><option value="岸和田"><option value="玉野"><option value="広島"><option value="防府"><option value="高松"><option value="小松島"><option value="高知"><option value="松山"><option value="小倉"><option value="久留米"><option value="武雄"><option value="佐世保"><option value="別府"><option value="熊本">
                        </datalist>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-400 font-bold mb-1">レース番号</label>
                        <input type="number" id="form-race-num" min="1" max="12" placeholder="9" required class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2 text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-gray-400 font-bold mb-1">グレード</label>
                        <select id="form-grade" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2 text-white focus:outline-none focus:border-accent">
                            <option value="FI">FI</option><option value="FII">FII</option><option value="GIII">GIII</option><option value="GII">GII</option><option value="GI">GI</option><option value="GP">GP</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 font-bold mb-1">出走選手・並び予想</label>
                    <textarea id="form-memo" rows="4" placeholder="コピペや並び予想（← 5 1 ・ 2 4 6）など自由入力" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2 text-white font-mono focus:outline-none focus:border-accent resize-none"></textarea>
                </div>

                <div class="border-t border-gray-800 pt-3 space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-gray-300 font-black">買い目の追加</label>
                        <button type="button" onclick="addBetRow()" class="bg-accent text-black font-bold px-2.5 py-1 rounded-lg text-xs flex items-center gap-0.5 shadow">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>追加
                        </button>
                    </div>
                    
                    <div id="bet-rows-container" class="space-y-2 max-h-[220px] overflow-y-auto pr-1"></div>
                </div>

                <div>
                    <label class="block text-gray-400 font-bold mb-1">予想根拠</label>
                    <div class="flex flex-wrap gap-1.5" id="reason-chips">
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">🔗 ライン読み</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">💨 脚質</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">🏅 級班</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">📈 近況成績</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">🏠 地元選手</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">☀️ 天候・風</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">🎰 バンク特性</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">💰 オッズ</span>
                        <span onclick="toggleChip(this)" class="bg-[#1f2833] text-gray-400 px-2.5 py-1 rounded-full cursor-pointer border border-gray-700">⚡ 直感</span>
                    </div>
                </div>

                <button type="submit" class="w-full bg-accent text-black font-bold py-2.5 rounded-xl text-sm active:scale-98 transition shadow-lg shadow-accent/10">
                    予想を保存する
                </button>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-[#0f141c]/95 border-t border-gray-800 backdrop-blur pb-safe z-40">
        <div class="flex justify-around max-w-md mx-auto">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 py-3 text-accent w-full">
                <i data-lucide="lightning" class="w-5 h-5"></i><span class="text-[10px] font-bold">ホーム</span>
            </button>
            <button onclick="switchTab('records')" id="nav-records" class="flex flex-col items-center gap-1 py-3 text-gray-500 w-full">
                <i data-lucide="clipboard-list" class="w-5 h-5"></i><span class="text-[10px] font-bold">記録</span>
            </button>
            <button onclick="switchTab('analysis')" id="nav-analysis" class="flex flex-col items-center gap-1 py-3 text-gray-500 w-full">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i><span class="text-[10px] font-bold">分析</span>
            </button>
        </div>
    </nav>

    <script>
        let predictions = JSON.parse(localStorage.getItem('keirin_data')) || [];

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initFormDefaults();
            renderApp();
        });

        // フォームを開いたときのデフォルト値をセット（日付のみ今日、他は前回の入力を残すために消さない）
        function initFormDefaults() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('form-date').value = today;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            const tabs = ['home', 'records', 'analysis'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    btn.classList.remove('text-gray-500'); btn.classList.add('text-accent');
                } else {
                    btn.classList.remove('text-accent'); btn.classList.add('text-gray-500');
                }
            });
            const titles = { home: 'ダッシュボード', records: '履歴一覧', analysis: 'データ分析' };
            document.getElementById('page-title').innerText = titles[tabId];
        }

        function openModal() {
            document.getElementById('prediction-modal').classList.remove('hidden');
            
            // 買い目コンテナが空なら最初の1行目を自動追加
            const container = document.getElementById('bet-rows-container');
            if(container.children.length === 0) {
                addBetRow();
            }
        }

        function closeModal() {
            document.getElementById('prediction-modal').classList.add('hidden');
            // 注意：入力項目を自動クリアしない（消さない限り残る仕様の維持）
            // 買い目の行だけリセット
            document.getElementById('bet-rows-container').innerHTML = '';
            document.querySelectorAll('#reason-chips span').forEach(el => el.classList.remove('chip-active'));
            addBetRow();
        }

        // 買い目入力行を新しく追加する関数（プラス➕スタイル）
        function addBetRow() {
            const container = document.getElementById('bet-rows-container');
            const rowId = Date.now() + Math.random();
            const rowHtml = `
                <div class="flex items-center gap-1.5 bg-black/30 p-2 rounded-xl border border-gray-850" id="row-${rowId}">
                    <select class="row-type bg-[#1f2833] border border-gray-700 rounded-lg p-1.5 text-white text-[11px] w-20">
                        <option value="三連単">三連単</option><option value="三連複">三連複</option>
                        <option value="二車単">二車単</option><option value="二車複">二車複</option>
                        <option value="ワイド">ワイド</option><option value="単勝">単勝</option><option value="複勝">複勝</option>
                    </select>
                    <input type="text" placeholder="2-4-5" required class="row-target w-full bg-[#1f2833] border border-gray-700 rounded-lg p-1.5 text-white font-mono placeholder-gray-600 text-xs">
                    <input type="number" min="0" step="100" placeholder="100" required class="row-money bg-[#1f2833] border border-gray-700 rounded-lg p-1.5 text-white text-xs w-16 text-center">
                    <button type="button" onclick="removeBetRow('row-${rowId}')" class="text-gray-500 hover:text-rose-400 p-1">
                        <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', rowHtml);
            lucide.createIcons();
        }

        function removeBetRow(id) {
            const row = document.getElementById(id);
            if (row) row.remove();
        }

        function toggleChip(el) {
            el.classList.toggle('chip-active');
        }

        // 保存処理
        function savePrediction(e) {
            e.preventDefault();

            const rows = document.getElementById('bet-rows-container').children;
            if (rows.length === 0) {
                alert('買い目を1つ以上追加してください。');
                return;
            }

            // 動的に増えた買い目データを配列で取得
            const betList = [];
            let totalInvest = 0;
            for (let row of rows) {
                const type = row.querySelector('.row-type').value;
                const target = row.querySelector('.row-target').value;
                const money = parseInt(row.querySelector('.row-money').value) || 0;
                betList.push({ type, target, money, status: 'pending', returnAmt: 0 });
                totalInvest += money;
            }

            // 選択された予想根拠
            const reasons = [];
            document.querySelectorAll('#reason-chips .chip-active').forEach(el => {
                reasons.push(el.innerText);
            });

            const raceItem = {
                id: Date.now(),
                date: document.getElementById('form-date').value,
                track: document.getElementById('form-track').value,
                raceNum: document.getElementById('form-race-num').value,
                grade: document.getElementById('form-grade').value,
                memo: document.getElementById('form-memo').value || '',
                reasons: reasons,
                bets: betList,
                invest: totalInvest,
                status: 'pending' // レース全体のステータス
            };

            predictions.unshift(raceItem);
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            
            // 買い目・根拠部分だけ閉じてクリア（競輪場や選手名は消さない）
            closeModal();
            renderApp();
        }

        function deleteItem(id) {
            predictions = predictions.filter(p => p.id !== id);
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            renderApp();
        }

        // 個別の買い目の的中・外れ処理
        function setBetResult(raceId, betIdx, status) {
            predictions = predictions.map(p => {
                if (p.id === raceId) {
                    let returnAmt = 0;
                    if (status === 'hit') {
                        const amt = prompt("該当の買い目の回収金額を入力してください (円):", "1000");
                        if (amt === null) return p;
                        returnAmt = parseInt(amt) || 0;
                    }
                    p.bets[betIdx].status = status;
                    p.bets[betIdx].returnAmt = returnAmt;

                    // 全買い目の状態を見て、レース全体のステータスを更新
                    const hasPending = p.bets.some(b => b.status === 'pending');
                    const hasHit = p.bets.some(b => b.status === 'hit');
                    if (!hasPending) {
                        p.status = hasHit ? 'hit' : 'miss';
                    } else {
                        p.status = 'pending';
                    }
                }
                return p;
            });
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            renderApp();
        }

        function clearAllData() {
            if (confirm("すべてのデータを完全に消去します。よろしいですか？")) {
                predictions = [];
                localStorage.removeItem('keirin_data');
                renderApp();
            }
        }

        function renderApp() {
            calculateStats();
            renderRecentList();
            renderAllRecords();
            renderAnalysis();
            lucide.createIcons();
        }

        function calculateStats() {
            let totalInvest = 0;
            let totalReturn = 0;
            let totalRacesFinished = 0;
            let hitRacesCount = 0;

            predictions.forEach(p => {
                totalInvest += p.invest;
                let raceFinished = true;
                let raceHit = false;

                p.bets.forEach(b => {
                    if (b.status === 'pending') raceFinished = false;
                    if (b.status === 'hit') {
                        totalReturn += b.returnAmt;
                        raceHit = true;
                    }
                });

                if (p.bets.length > 0 && raceFinished) {
                    totalRacesFinished++;
                    if (raceHit) hitRacesCount++;
                }
            });

            const hitRate = totalRacesFinished ? Math.round((hitRacesCount / totalRacesFinished) * 100) : 0;
            const returnRate = totalInvest ? Math.round((totalReturn / totalInvest) * 100) : 0;
            const profit = totalReturn - totalInvest;

            document.getElementById('stat-hit-rate').innerText = `${hitRate}%`;
            document.getElementById('stat-count').innerText = `${hitRacesCount}/${totalRacesFinished} レース`;
            document.getElementById('stat-return-rate').innerText = `${returnRate}%`;
            document.getElementById('stat-total-invest').innerText = `${totalInvest.toLocaleString()}円`;
            
            const profitEl = document.getElementById('stat-profit');
            if (profit >= 0) {
                profitEl.innerText = `+${profit.toLocaleString()}円`;
                profitEl.className = "text-2xl font-black text-accent mt-1";
            } else {
                profitEl.innerText = `${profit.toLocaleString()}円`;
                profitEl.className = "text-2xl font-black text-rose-400 mt-1";
            }
        }

        function buildCardHtml(p) {
            // 全体バッジ
            let statusBadge = `<span class="bg-gray-800 text-gray-400 font-bold px-2 py-0.5 rounded text-[10px]">結果待ち</span>`;
            let totalReturnAmt = 0;
            
            const isAllFinished = p.bets.every(b => b.status !== 'pending');
            const isAnyHit = p.bets.some(b => b.status === 'hit');
            p.bets.forEach(b => totalReturnAmt += b.returnAmt);

            if (p.bets.length > 0 && isAllFinished) {
                statusBadge = isAnyHit 
                    ? `<span class="bg-accent/20 text-accent font-bold px-2 py-0.5 rounded text-[10px]">的中</span>`
                    : `<span class="bg-rose-950 text-rose-400 font-bold px-2 py-0.5 rounded text-[10px]">不的中</span>`;
            }

            // 買い目リストのHTML構築
            const betsHtml = p.bets.map((b, idx) => {
                let actionHtml = '';
                if (b.status === 'pending') {
                    actionHtml = `
                        <div class="flex gap-1 scale-90 origin-right">
                            <button onclick="setBetResult(${p.id}, ${idx}, 'hit')" class="bg-accent text-black font-bold px-2 py-0.5 rounded text-[10px]">的中</button>
                            <button onclick="setBetResult(${p.id}, ${idx}, 'miss')" class="bg-gray-800 text-gray-400 px-2 py-0.5 rounded text-[10px]">外れ</button>
                        </div>`;
                } else if (b.status === 'hit') {
                    actionHtml = `<span class="text-accent font-bold text-[11px]">+${b.returnAmt.toLocaleString()}円</span>`;
                } else {
                    actionHtml = `<span class="text-gray-600 text-[11px]">0円</span>`;
                }

                return `
                    <div class="flex justify-between items-center bg-black/20 px-2 py-1.5 rounded border border-gray-900/50 text-[11px]">
                        <div class="flex items-center gap-1.5">
                            <span class="text-gray-400 font-bold bg-gray-900 px-1 py-0.2 rounded text-[10px]">${b.type}</span>
                            <span class="font-mono text-white">${b.target}</span>
                            <span class="text-gray-500">(${b.money}円)</span>
                        </div>
                        ${actionHtml}
                    </div>
                `;
            }).join('');

            const reasonHtml = p.reasons && p.reasons.length > 0 
                ? `<div class="flex flex-wrap gap-1 mt-2">${p.reasons.map(r => `<span class="text-[9px] text-gray-400 bg-gray-900 px-2 py-0.5 rounded-full">${r}</span>`).join('')}</div>`
                : '';

            const memoSection = p.memo ? `<p class="text-xs text-gray-300 bg-black/40 p-2 rounded-lg border border-gray-800 mt-2 font-mono whitespace-pre-wrap break-all">${p.memo}</p>` : '';

            return `
                <div class="bg-[#1f2833]/40 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-white text-base">${p.track}</span>
                                <span class="text-xs text-gray-400">${p.raceNum}R</span>
                                <span class="text-[10px] text-gray-500 bg-gray-900 px-1.5 py-0.5 rounded border border-gray-800">${p.grade}</span>
                                ${statusBadge}
                            </div>
                            <p class="text-[10px] text-gray-500">${p.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-gray-500">合計回収</p>
                            <p class="font-black text-sm ${totalReturnAmt > 0 ? 'text-accent' : 'text-gray-500'}">${totalReturnAmt.toLocaleString()}円</p>
                        </div>
                    </div>
                    
                    <div class="mt-2.5 space-y-1">${betsHtml}</div>
                    
                    ${reasonHtml}
                    ${memoSection}

                    <div class="flex justify-between items-center mt-2.5 pt-2 border-t border-gray-800/50">
                        <p class="text-[11px] text-gray-400">総投資: <span class="font-bold text-gray-200">${p.invest.toLocaleString()}円</span></p>
                        <button onclick="deleteItem(${p.id})" class="text-gray-600 hover:text-rose-400 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>
            `;
        }

        function renderRecentList() {
            const container = document.getElementById('recent-predictions-list');
            if (predictions.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-600 py-8">まだ予想がありません<br><span class="text-accent cursor-pointer" onclick="openModal()">+ 予想追加</span>から記録しよう</p>`;
                return;
            }
            const recent = predictions.slice(0, 3);
            container.innerHTML = recent.map(p => buildCardHtml(p)).join('');
        }

        function renderAllRecords() {
            const container = document.getElementById('all-records-list');
            if (predictions.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-600 py-8">履歴がありません</p>`;
                return;
            }
            container.innerHTML = predictions.map(p => buildCardHtml(p)).join('');
        }

        function renderAnalysis() {
            const trackData = {};
            const gradeData = {};

            predictions.forEach(p => {
                let trackReturn = 0;
                let gradeReturn = 0;
                p.bets.forEach(b => {
                    if (b.status === 'hit') {
                        trackReturn += b.returnAmt;
                        gradeReturn += b.returnAmt;
                    }
                });

                if (!trackData[p.track]) trackData[p.track] = { invest: 0, returnAmt: 0, count: 0 };
                trackData[p.track].invest += p.invest;
                trackData[p.track].returnAmt += trackReturn;
                trackData[p.track].count++;

                if (!gradeData[p.grade]) gradeData[p.grade] = { invest: 0, returnAmt: 0 };
                gradeData[p.grade].invest += p.invest;
                gradeData[p.grade].returnAmt += gradeReturn;
            });

            const trackList = Object.keys(trackData).map(name => {
                const d = trackData[name];
                const rate = d.invest ? Math.round((d.returnAmt / d.invest) * 100) : 0;
                const profit = d.returnAmt - d.invest;
                return { name, rate, profit, count: d.count };
            });
            trackList.sort((a, b) => b.profit - a.profit);

            const trackContainer = document.getElementById('track-ranking');
            if (trackList.length === 0) {
                trackContainer.innerHTML = `<p class="text-gray-600 text-center py-2">データが不足しています</p>`;
            } else {
                trackContainer.innerHTML = trackList.slice(0, 3).map((t, idx) => `
                    <div class="flex justify-between items-center bg-black/20 p-2 rounded-xl border border-gray-900">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-accent text-xs w-4">${idx + 1}</span>
                            <span class="font-bold text-white">${t.name}</span>
                            <span class="text-[10px] text-gray-500">${t.count}戦</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-xs ${t.profit >= 0 ? 'text-accent' : 'text-rose-400'}">${t.profit >= 0 ? '+' : ''}${t.profit.toLocaleString()}円</span>
                            <span class="text-[10px] text-gray-500 ml-2">(${t.rate}%)</span>
                        </div>
                    </div>
                `).join('');
            }

            const gradeContainer = document.getElementById('grade-ranking');
            const grades = ['GP', 'GI', 'GII', 'GIII', 'FI', 'FII'];
            let gradeHtml = '';
            let hasGradeData = false;

            grades.forEach(g => {
                if (gradeData[g]) {
                    hasGradeData = true;
                    const d = gradeData[g];
                    const rate = d.invest ? Math.round((d.returnAmt / d.invest) * 100) : 0;
                    const profit = d.returnAmt - d.invest;
                    gradeHtml += `
                        <div class="flex justify-between items-center bg-black/20 p-2 rounded-xl border border-gray-900">
                            <span class="font-bold text-white bg-gray-900 px-2 py-0.5 rounded border border-gray-800 text-[11px]">${g}</span>
                            <div class="text-right">
                                <span class="font-black ${rate >= 100 ? 'text-accent' : 'text-gray-400'}">${rate}%</span>
                                <span class="text-[10px] text-gray-500 ml-2">収支: ${profit >= 0 ? '+' : ''}${profit.toLocaleString()}円</span>
                            </div>
                        </div>`;
                }
            });

            if (!hasGradeData) {
                gradeContainer.innerHTML = `<p class="text-gray-600 text-center py-2">データが不足しています</p>`;
            } else {
                gradeContainer.innerHTML = gradeHtml;
            }
        }
    </script>
</body>
</html>
