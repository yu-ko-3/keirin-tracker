<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KEIRIN TRACKER</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Web App Manifest & iOS Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="競輪メモ">
    <link rel="apple-touch-icon" href="https://placeholder.co/192">
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .text-neon { color: #66fcf1; }
        .bg-neon { background-color: #66fcf1; }
        .text-accent { color: #c5e1a5; }
        .bg-accent { background-color: #c5e1a5; }
        .border-neon { border-color: #66fcf1; }
        /* スムーズな画面切り替え */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="pb-24 select-none">

    <!-- HEADER -->
    <header class="p-4 pt-8 border-b border-gray-800 bg-[#1f2833]/30 backdrop-blur sticky top-0 z-40 flex justify-between items-center">
        <div>
            <p class="text-xs tracking-widest text-gray-500 font-bold uppercase">Keirin Tracker</p>
            <h1 id="page-title" class="text-2xl font-black text-white tracking-tight">ダッシュボード</h1>
        </div>
        <button onclick="openModal()" class="bg-accent text-black font-bold px-4 py-2 rounded-full text-sm flex items-center gap-1 shadow-lg shadow-accent/20 active:scale-95 transition">
            <i data-lucide="plus" class="w-4 h-4"></i>予想追加
        </button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="p-4 max-w-md mx-auto">
        
        <!-- TAB 1: DASHBOARD -->
        <div id="tab-home" class="tab-content active space-y-4">
            <!-- STATS GRID -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">的中率</p>
                    <p id="stat-hit-rate" class="text-2xl font-black text-accent mt-1">0%</p>
                    <p id="stat-count" class="text-xs text-gray-500 mt-1">0/0 レース</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">回収率</p>
                    <p id="stat-return-rate" class="text-2xl font-black text-rose-400 mt-1">0%</p>
                    <p id="stat-io" class="text-xs text-gray-500 mt-1">投資対回収</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">累計損益</p>
                    <p id="stat-profit" class="text-2xl font-black text-accent mt-1">+0円</p>
                </div>
                <div class="bg-[#1f2833]/50 p-4 rounded-2xl border border-gray-800">
                    <p class="text-xs text-gray-400 font-medium">総投資額</p>
                    <p id="stat-total-invest" class="text-2xl font-black text-gray-300 mt-1">0円</p>
                </div>
            </div>

            <!-- RECENT LIST -->
            <div class="space-y-2">
                <h3 class="text-sm font-bold text-gray-400 px-1">最近の予想</h3>
                <div id="recent-predictions-list" class="space-y-2">
                    <!-- 案内表示 -->
                    <p class="text-center text-sm text-gray-600 py-8">まだ予想がありません<br><span class="text-accent cursor-pointer" onclick="openModal()">+ 予想追加</span>から記録しよう</p>
                </div>
            </div>
        </div>

        <!-- TAB 2: RECORDS -->
        <div id="tab-records" class="tab-content space-y-3">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-bold text-gray-400">すべての履歴</h3>
                <button onclick="clearAllData()" class="text-xs text-rose-400 flex items-center gap-1 bg-rose-950/20 px-2 py-1 rounded border border-rose-900/30">
                    <i data-lucide="trash-2" class="w-3 h-3"></i>全消去
                </button>
            </div>
            <div id="all-records-list" class="space-y-2"></div>
        </div>

        <!-- TAB 3: ANALYSIS -->
        <div id="tab-analysis" class="tab-content space-y-4">
            <!-- 競率場別分析 -->
            <div class="bg-[#1f2833]/30 p-4 rounded-2xl border border-gray-800">
                <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                    <i data-lucide="map-pin" class="w-4 h-4 text-accent"></i>競輪場別 相性トップ3
                </h3>
                <div id="track-ranking" class="space-y-2 text-sm text-gray-400">
                    <p class="text-gray-600 text-center py-2">データが不足しています</p>
                </div>
            </div>
            <!-- グレード別分析 -->
            <div class="bg-[#1f2833]/30 p-4 rounded-2xl border border-gray-800">
                <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
                    <i data-lucide="award" class="w-4 h-4 text-accent"></i>グレード別 回収率
                </h3>
                <div id="grade-ranking" class="space-y-2 text-sm text-gray-400">
                    <p class="text-gray-600 text-center py-2">データが不足しています</p>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL: ADD PREDICTION -->
    <div id="prediction-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#151a22] w-full max-w-md rounded-t-3xl sm:rounded-3xl border-t sm:border border-gray-800 max-h-[90vh] overflow-y-auto p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h2 class="text-lg font-black text-white">レース予想の記録</h2>
                <button onclick="closeModal()" class="text-gray-400 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="prediction-form" onsubmit="savePrediction(event)" class="space-y-4 text-sm">
                <!-- 日付・競輪場・グレード -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">日付</label>
                        <input type="date" id="form-date" required class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">競輪場</label>
                        <select id="form-track" required class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                            <!-- 北日本 -->
                            <optgroup label="北日本">
                                <option value="函館">函館</option><option value="青森">青森</option><option value="いわき平">いわき平</option>
                            </optgroup>
                            <!-- 関東 -->
                            <optgroup label="関東">
                                <option value="弥彦">弥彦</option><option value="前橋">前橋</option><option value="取手">取手</option><option value="宇都宮">宇都宮</option><option value="大宮">大宮</option><option value="西武園">西武園</option><option value="京王閣">京王閣</option><option value="立川">立川</option>
                            </optgroup>
                            <!-- 南関東 -->
                            <optgroup label="南関東">
                                <option value="松戸">松戸</option><option value="千葉">千葉JP</option><option value="川崎">川崎</option><option value="平塚">平塚</option><option value="小田原">小田原</option><option value="伊東">伊東</option><option value="静岡">静岡</option>
                            </optgroup>
                            <!-- 中部 -->
                            <optgroup label="中部">
                                <option value="名古屋">名古屋</option><option value="岐阜">岐阜</option><option value="大垣">大垣</option><option value="豊橋">豊橋</option><option value="富山">富山</option><option value="松阪">松阪</option><option value="四日市">四日市</option>
                            </optgroup>
                            <!-- 近畿 -->
                            <optgroup label="近畿">
                                <option value="福井">福井</option><option value="京都向日町">京都向日町</option><option value="奈良">奈良</option><option value="和歌山">和歌山</option><option value="岸和田">岸和田</option>
                            </optgroup>
                            <!-- 中国 -->
                            <optgroup label="中国">
                                <option value="玉野">玉野</option><option value="広島">広島</option><option value="防府">防府</option>
                            </optgroup>
                            <!-- 四国 -->
                            <optgroup label="四国">
                                <option value="高松">高松</option><option value="小松島">小松島</option><option value="高知">高知</option><option value="松山">松山</option>
                            </optgroup>
                            <!-- 九州 -->
                            <optgroup label="九州">
                                <option value="小倉">小倉</option><option value="久留米">久留米</option><option value="武雄">武雄</option><option value="佐世保">佐世保</option><option value="別府">別府</option><option value="熊本">熊本</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">レース番号</label>
                        <select id="form-race-num" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                            <option value="1">1 R</option><option value="2">2 R</option><option value="3">3 R</option><option value="4">4 R</option><option value="5">5 R</option><option value="6">6 R</option><option value="7">7 R</option><option value="8">8 R</option><option value="9">9 R</option><option value="10">10 R</option><option value="11">11 R</option><option value="12">12 R</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">グレード</label>
                        <select id="form-grade" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                            <option value="FII">FII</option><option value="FI">FI</option><option value="GIII">GIII</option><option value="GII">GII</option><option value="GI">GI</option><option value="GP">GP</option>
                        </select>
                    </div>
                </div>

                <!-- 投資・回収・結果 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">投資金額 (円)</label>
                        <input type="number" id="form-invest" min="0" step="100" required placeholder="1000" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-bold mb-1">レース結果</label>
                        <select id="form-status" onchange="toggleReturnInput()" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-accent">
                            <option value="pending">結果待ち</option>
                            <option value="hit">的中</option>
                            <option value="miss">不的中</option>
                        </select>
                    </div>
                </div>

                <!-- 回収金額（デフォルト非表示、的中時のみ） -->
                <div id="return-input-container" class="hidden">
                    <label class="block text-xs text-accent font-bold mb-1">回収金額 (円)</label>
                    <input type="number" id="form-return" min="0" step="10" placeholder="2500" class="w-full bg-[#1f2833] border border-accent rounded-xl p-2.5 text-white focus:outline-none">
                </div>

                <!-- メモ欄（出走表・並び予想用） -->
                <div>
                    <label class="block text-xs text-gray-400 font-bold mb-1">出走表・並び・展開メモ</label>
                    <textarea id="form-memo" rows="6" class="w-full bg-[#1f2833] border border-gray-700 rounded-xl p-2.5 text-white font-mono text-xs focus:outline-none focus:border-accent resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-accent text-black font-bold py-3 rounded-xl active:scale-98 transition mt-2 shadow-lg shadow-accent/10">
                    予想を保存する
                </button>
            </form>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0f141c]/95 border-t border-gray-800 backdrop-blur pb-safe z-40">
        <div class="flex justify-around max-w-md mx-auto">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 py-3 text-accent w-full">
                <i data-lucide="lightning" class="w-5 h-5"></i><span class="text-[10px] font-bold">ホーム</span>
            </button>
            <button onclick="switchTab('records')" id="nav-records" class="flex flex-col items-center gap-1 py-3 text-gray-500 w-full">
                <i data-lucide="clipboard-list" class="w-5 h-5"></i><span class="text-[10px] font-bold">記録</span>
            </button>
            <button onclick="switchTab('analysis')" id="nav-analysis" class="flex flex-col items-center gap-1 py-3 text-gray-500 w-full">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i><span class="text-[10px] font-bold">分析</span>
            </button>
        </div>
    </nav>

    <!-- CORE SCRIPT -->
    <script>
        let predictions = JSON.parse(localStorage.getItem('keirin_data')) || [];

        // メモ欄のデフォルトテンプレート
        const DEFAULT_MEMO_TEMPLATE = `【出走表・印】\n1 ◎ \n2 ◯ \n3 ▲ \n4 \n\n【並び予想】\n← `;

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initDate();
            renderApp();
        });

        function initDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('form-date').value = today;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            const tabs = ['home', 'records', 'analysis'];
            tabs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tabId) {
                    btn.classList.remove('text-gray-500');
                    btn.classList.add('text-accent');
                } else {
                    btn.classList.remove('text-accent');
                    btn.classList.add('text-gray-500');
                }
            });

            const titles = { home: 'ダッシュボード', records: '履歴一覧', analysis: 'データ分析' };
            document.getElementById('page-title').innerText = titles[tabId];
        }

        function openModal() {
            document.getElementById('prediction-modal').classList.remove('hidden');
            initDate();
            // メモ欄にテンプレートを自動セット
            document.getElementById('form-memo').value = DEFAULT_MEMO_TEMPLATE;
        }

        function closeModal() {
            document.getElementById('prediction-modal').classList.add('hidden');
            document.getElementById('prediction-form').reset();
            toggleReturnInput();
        }

        function toggleReturnInput() {
            const status = document.getElementById('form-status').value;
            const container = document.getElementById('return-input-container');
            const returnInput = document.getElementById('form-return');
            if (status === 'hit') {
                container.classList.remove('hidden');
                returnInput.required = true;
            } else {
                container.classList.add('hidden');
                returnInput.required = false;
                returnInput.value = '';
            }
        }

        function savePrediction(e) {
            e.preventDefault();
            const status = document.getElementById('form-status').value;
            let returnAmt = 0;
            if (status === 'hit') returnAmt = parseInt(document.getElementById('form-return').value) || 0;
            if (status === 'miss') returnAmt = 0;

            const item = {
                id: Date.now(),
                date: document.getElementById('form-date').value,
                track: document.getElementById('form-track').value,
                raceNum: document.getElementById('form-race-num').value,
                grade: document.getElementById('form-grade').value,
                invest: parseInt(document.getElementById('form-invest').value) || 0,
                status: status,
                returnAmt: returnAmt,
                memo: document.getElementById('form-memo').value || ''
            };

            predictions.unshift(item);
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            closeModal();
            renderApp();
        }

        function deleteItem(id) {
            predictions = predictions.filter(p => p.id !== id);
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            renderApp();
        }

        function updateStatusDirect(id, status, returnAmt = 0) {
            predictions = predictions.map(p => {
                if (p.id === id) {
                    return { ...p, status, returnAmt };
                }
                return p;
            });
            localStorage.setItem('keirin_data', JSON.stringify(predictions));
            renderApp();
        }

        function promptHitResult(id) {
            const amt = prompt("回収金額を入力してください (円):", "1000");
            if (amt !== null) {
                const returnAmt = parseInt(amt) || 0;
                updateStatusDirect(id, 'hit', returnAmt);
            }
        }

        function clearAllData() {
            if (confirm("すべてのデータを完全に消去します。よろしいですか？")) {
                predictions = [];
                localStorage.removeItem('keirin_data');
                renderApp();
            }
        }

        function renderApp() {
            calculateStats();
            renderRecentList();
            renderAllRecords();
            renderAnalysis();
            lucide.createIcons();
        }

        function calculateStats() {
            const finished = predictions.filter(p => p.status !== 'pending');
            const hits = finished.filter(p => p.status === 'hit');
            
            let totalInvest = 0;
            let totalReturn = 0;
            predictions.forEach(p => totalInvest += p.invest);
            finished.forEach(p => totalReturn += p.returnAmt);

            const hitRate = finished.length ? Math.round((hits.length / finished.length) * 100) : 0;
            const returnRate = totalInvest ? Math.round((totalReturn / totalInvest) * 100) : 0;
            const profit = totalReturn - totalInvest;

            document.getElementById('stat-hit-rate').innerText = `${hitRate}%`;
            document.getElementById('stat-count').innerText = `${hits.length}/${finished.length} レース`;
            document.getElementById('stat-return-rate').innerText = `${returnRate}%`;
            document.getElementById('stat-total-invest').innerText = `${totalInvest.toLocaleString()}円`;
            
            const profitEl = document.getElementById('stat-profit');
            if (profit >= 0) {
                profitEl.innerText = `+${profit.toLocaleString()}円`;
                profitEl.className = "text-2xl font-black text-accent mt-1";
            } else {
                profitEl.innerText = `${profit.toLocaleString()}円`;
                profitEl.className = "text-2xl font-black text-rose-400 mt-1";
            }
        }

        function buildCardHtml(p) {
            let statusBadge = '';
            let rightSection = '';

            if (p.status === 'hit') {
                statusBadge = `<span class="bg-accent/20 text-accent font-bold px-2 py-0.5 rounded text-[10px]">的中</span>`;
                rightSection = `
                    <div class="text-right">
                        <p class="text-xs text-gray-500">回収</p>
                        <p class="font-black text-accent">+${p.returnAmt.toLocaleString()}円</p>
                    </div>`;
            } else if (p.status === 'miss') {
                statusBadge = `<span class="bg-rose-950 text-rose-400 font-bold px-2 py-0.5 rounded text-[10px]">不的中</span>`;
                rightSection = `
                    <div class="text-right">
                        <p class="text-xs text-gray-500">回収</p>
                        <p class="font-black text-gray-600">0円</p>
                    </div>`;
            } else {
                statusBadge = `<span class="bg-gray-800 text-gray-400 font-bold px-2 py-0.5 rounded text-[10px]">結果待ち</span>`;
                rightSection = `
                    <div class="flex gap-1">
                        <button onclick="promptHitResult(${p.id})" class="bg-accent text-black font-bold px-2 py-1 rounded text-xs">的中</button>
                        <button onclick="updateStatusDirect(${p.id}, 'miss')" class="bg-gray-800 text-gray-300 font-bold px-2 py-1 rounded text-xs">外れ</button>
                    </div>`;
            }

            const memoSection = p.memo ? `<p class="text-xs text-gray-300 bg-black/40 p-2.5 rounded-lg border border-gray-800 mt-2 font-mono whitespace-pre-wrap break-all">${p.memo}</p>` : '';

            return `
                <div class="bg-[#1f2833]/40 p-4 rounded-xl border border-gray-800 flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div class="space-y-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-white text-base">${p.track}</span>
                                <span class="text-xs text-gray-400">${p.raceNum}R</span>
                                <span class="text-[10px] text-gray-500 bg-gray-900 px-1.5 py-0.5 rounded border border-gray-800">${p.grade}</span>
                                ${statusBadge}
                            </div>
                            <p class="text-[11px] text-gray-500">${p.date}</p>
                        </div>
                        ${rightSection}
                    </div>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-gray-800/50">
                        <p class="text-xs text-gray-400">投資: <span class="font-bold text-gray-200">${p.invest.toLocaleString()}円</span></p>
                        <button onclick="deleteItem(${p.id})" class="text-gray-600 hover:text-rose-400 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                    ${memoSection}
                </div>
            `;
        }

        function renderRecentList() {
            const container = document.getElementById('recent-predictions-list');
            if (predictions.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-600 py-8">まだ予想がありません<br><span class="text-accent cursor-pointer" onclick="openModal()">+ 予想追加</span>から記録しよう</p>`;
                return;
            }
            const recent = predictions.slice(0, 3);
            container.innerHTML = recent.map(p => buildCardHtml(p)).join('');
        }

        function renderAllRecords() {
            const container = document.getElementById('all-records-list');
            if (predictions.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-600 py-8">履歴がありません</p>`;
                return;
            }
            container.innerHTML = predictions.map(p => buildCardHtml(p)).join('');
        }

        function renderAnalysis() {
            const trackData = {};
            const gradeData = {};

            predictions.forEach(p => {
                if (!trackData[p.track]) trackData[p.track] = { invest: 0, returnAmt: 0, count: 0 };
                trackData[p.track].invest += p.invest;
                trackData[p.track].count++;
                if (p.status === 'hit') trackData[p.track].returnAmt += p.returnAmt;

                if (!gradeData[p.grade]) gradeData[p.grade] = { invest: 0, returnAmt: 0 };
                gradeData[p.grade].invest += p.invest;
                if (p.status === 'hit') gradeData[p.grade].returnAmt += p.returnAmt;
            });

            const trackList = Object.keys(trackData).map(name => {
                const d = trackData[name];
                const rate = d.invest ? Math.round((d.returnAmt / d.invest) * 100) : 0;
                const profit = d.returnAmt - d.invest;
                return { name, rate, profit, count: d.count };
            });
            trackList.sort((a, b) => b.profit - a.profit);

            const trackContainer = document.getElementById('track-ranking');
            if (trackList.length === 0) {
                trackContainer.innerHTML = `<p class="text-gray-600 text-center py-2">データが不足しています</p>`;
            } else {
                trackContainer.innerHTML = trackList.slice(0, 3).map((t, idx) => `
                    <div class="flex justify-between items-center bg-black/20 p-2.5 rounded-xl border border-gray-900">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-accent text-sm w-4">${idx + 1}</span>
                            <span class="font-bold text-white">${t.name}</span>
                            <span class="text-[10px] text-gray-500">${t.count}戦</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold text-sm ${t.profit >= 0 ? 'text-accent' : 'text-rose-400'}">${t.profit >= 0 ? '+' : ''}${t.profit.toLocaleString()}円</span>
                            <span class="text-xs text-gray-500 ml-2">(${t.rate}%)</span>
                        </div>
                    </div>
                `).join('');
            }

            const gradeContainer = document.getElementById('grade-ranking');
            const grades = ['GP', 'GI', 'GII', 'GIII', 'FI', 'FII'];
            let gradeHtml = '';
            let hasGradeData = false;

            grades.forEach(g => {
                if (gradeData[g]) {
                    hasGradeData = true;
                    const d = gradeData[g];
                    const rate = d.invest ? Math.round((d.returnAmt / d.invest) * 100) : 0;
                    const profit = d.returnAmt - d.invest;
                    gradeHtml += `
                        <div class="flex justify-between items-center bg-black/20 p-2.5 rounded-xl border border-gray-900">
                            <span class="font-bold text-white bg-gray-900 px-2 py-0.5 rounded border border-gray-800 text-xs">${g}</span>
                            <div class="text-right">
                                <span class="font-black ${rate >= 100 ? 'text-accent' : 'text-gray-400'}">${rate}%</span>
                                <span class="text-xs text-gray-500 ml-2">収支: ${profit >= 0 ? '+' : ''}${profit.toLocaleString()}円</span>
                            </div>
                        </div>`;
                }
            });

            if (!hasGradeData) {
                gradeContainer.innerHTML = `<p class="text-gray-600 text-center py-2">データが不足しています</p>`;
            } else {
                gradeContainer.innerHTML = gradeHtml;
            }
        }
    </script>
</body>
</html>
